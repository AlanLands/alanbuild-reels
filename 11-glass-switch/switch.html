<!doctype html>
<!-- The liquid glass switch from the reel, as a plain page you can copy. Open it in Chrome or Edge (backdrop-filter: url()
     is Chromium-only today; Safari and Firefox show the frosted fallback). Hold the switch to see the knob turn into a lens. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Liquid glass switch</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f9f5; font: 16px system-ui; }
  .switch { position: relative; display: inline-block; width: 64px; height: 28px; border-radius: 999px; background: #b9c2b4;
    transition: background .5s cubic-bezier(.16,1,.3,1); cursor: pointer; zoom: 3; }
  .switch:has(:checked) { background: #4f9a2e; }
  .switch input { position: absolute; opacity: 0; }
  .knob { position: absolute; left: 2px; top: 2px; width: 38px; height: 24px; border-radius: 999px; background: #fff;
    box-shadow: 0 1px 3px #0003, inset 0 0.6px 1.2px #fff;
    /* the 5 lines from the reel */
    transition: .5s cubic-bezier(.16,1,.3,1); }
  :checked + .knob { translate: 22px; }
  :active > .knob {
    scale: 1.4 1.2;
    background: #fff2;
    backdrop-filter: url(#lens) saturate(1.6); }
</style>
</head>
<body>
  <!-- #lens: one SVG displacement map (lens.png, a stadium-shaped map: red = x shift, green = y shift, flat grey in the middle) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feImage href="lens.png" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map" />
      <feDisplacementMap in="SourceGraphic" in2="map" scale="9" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <label class="switch"><input type="checkbox" checked /><span class="knob"></span></label>
</body>
</html>
