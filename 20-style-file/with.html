<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #F5FAF1;
  }
  button {
    font: 700 18px system-ui;
    letter-spacing: -0.02em;
    color: #fff;
    background: #4F9A2E;
    border: 0;
    border-radius: 999px;
    padding: 16px 32px;
    box-shadow: 0 8px 20px rgba(47,110,28,.18);
    cursor: pointer;
    transition: background .2s cubic-bezier(.16,1,.3,1), transform .2s cubic-bezier(.16,1,.3,1);
  }
  button:hover { background: #1F4D12; }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid #1F4D12; outline-offset: 3px; }
</style>
</head>
<body>
  <button type="button">Sign up</button>
</body>
</html>
