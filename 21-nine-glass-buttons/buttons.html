  border-radius: 43%; background: linear-gradient(180deg, #7ff0a8 0%, #1fa85a 14%, #147a42 100%); transform: rotate(calc(var(--t) * 540deg)); }

  background-position: calc(var(--t) * 68px * var(--u)) 0, calc((17px + var(--t) * 68px) * var(--u)) calc(17px * var(--u)); }

  background-position: calc(var(--t) * 150px * var(--u)) 50%, calc(var(--t) * -165px * var(--u)) 18%; }

  background-size: calc(67.954px * var(--u)) 100%; background-position: calc(var(--t) * 135.908px * var(--u)) 0; }

* { margin: 0; padding: 0; box-sizing: border-box; }
body { --u: 1; --f: system-ui, sans-serif; --bt: 0px; --bh: 100%; background: #10120e; color: #fff; font-family: system-ui, sans-serif; padding: 32px 16px; }
h1 { text-align: center; font-size: 30px; letter-spacing: -0.03em; }
p.sub { text-align: center; opacity: 0.7; margin: 6px 0 28px; }
main { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 18px; max-width: 1220px; margin: 0 auto; }
figure { position: relative; height: 280px; border-radius: 28px; overflow: hidden; display: flex; align-items: center; justify-content: center; animation: drift 8s linear infinite alternate; color: var(--fg); }
@keyframes drift { to { --t: 1; } }
figcaption { position: absolute; left: 18px; bottom: 14px; font-size: 14px; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: #10120ecc; color: #fff; }
.b { cursor: pointer; transition: --p .35s ease-out; }
.b1:active { --p: 1; }
.b2 { transition: --p .8s ease-in-out; }
.b3 { transition: --p .6s cubic-bezier(.3, 2.4, .4, 1); }
.b7 { transition: --p 1.4s ease-in-out; }
.b8 { transition: --p .6s cubic-bezier(.3, 1.8, .5, 1); }
.b2:hover, .b4:hover, .b7:hover, .b8:hover, .b2:focus-visible, .b4:focus-visible, .b7:focus-visible, .b8:focus-visible { --p: 1; }
.b3:active, .b5:active, .b6:active, .b9:active { --p: 1; }
@media (prefers-reduced-motion: reduce) { figure { animation: none; } .b { transition: none; } }
