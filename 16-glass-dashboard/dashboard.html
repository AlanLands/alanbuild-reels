<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass card: 3 lines of CSS + 1 lens</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 600 16px system-ui, sans-serif; overflow: hidden;
    background: repeating-linear-gradient(105deg, #ff5a0a 0 32px, #7a2cff 32px 64px, #2f6bff 64px 96px, #ff3d8b 96px 128px, #19b36b 128px 160px);
    background-size: 331.3px 100%; animation: flow 6s linear infinite; }   /* 331.3 = 2 stripe periods (160 / sin 105deg) */
  @keyframes flow { to { background-position: -331.3px 0; } }
  @media (prefers-reduced-motion: reduce) { body { animation: none; } }
  main { display: grid; gap: 9px; }

  /* the whole effect: 3 lines + the #lens filter below */
  .card {
    background: #fff3;
    box-shadow: inset 0 1px 2px #fff;
    backdrop-filter: url(#lens);
  }

  /* layout only. The lens map is 345 x 80 with radius 20: for another size, make a new map with mkmap.py */
  .card { width: 345px; height: 80px; border-radius: 20px; box-sizing: border-box; padding: 11px 22px; color: #fff; text-shadow: 0 1px 5px #0006; }
  .card small { display: block; font-size: 16px; }
  .card b { font-size: 36px; line-height: 38px; letter-spacing: -0.04em; }
</style>
</head>
